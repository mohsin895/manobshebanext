name: Deploy to medhabritti.manabseba.org

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /root/apps/medhabritti
            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm build

            # copy the build output to the live folder
            TARGET=/home/mohsin/web/medhabritti.manabseba.org/public_html
            rsync -a --delete \
              --exclude='.well-known' --exclude='cgi-bin' \
              dist/ "$TARGET"/
            chown -R mohsin:mohsin "$TARGET"